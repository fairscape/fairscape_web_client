<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Loading notebook...</title>
  <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f5f5f5;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #ddd;
      border-top-color: #FFDC00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { margin-left: 16px; white-space: pre-line; font-size: 14px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div id="status">Loading notebook into JupyterLite...</div>

  <script>
    /**
     * Bridge script: reads a notebook from localStorage (set by the FAIRSCAPE app),
     * writes it into JupyterLite's IndexedDB-backed virtual filesystem using
     * localforage (the same library JupyterLite uses), then redirects to
     * JupyterLite lab with the notebook open.
     */
    const statusEl = document.getElementById("status");

    function log(msg) {
      console.log("[bridge]", msg);
      statusEl.textContent += "\n" + msg;
    }

    (async function () {
      const LAB_URL = "lab/index.html";

      // Step 1: Read from localStorage
      const raw = localStorage.getItem("fairscape:notebook");
      if (!raw) {
        log("No notebook found in localStorage. Redirecting to lab...");
        window.location.replace(LAB_URL);
        return;
      }
      log("Found notebook in localStorage (" + raw.length + " chars)");

      let data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        log("ERROR: Failed to parse localStorage JSON: " + e.message);
        window.location.replace(LAB_URL);
        return;
      }

      const filename = data.filename || "explore.ipynb";
      const notebook = data.content;
      log("Filename: " + filename);
      log("Notebook cells: " + (notebook.cells ? notebook.cells.length : "unknown"));

      // Step 2: List existing IndexedDB databases to find JupyterLite's
      if (indexedDB.databases) {
        try {
          const dbs = await indexedDB.databases();
          log("Existing IndexedDB databases: " + JSON.stringify(dbs.map(d => d.name + " v" + d.version)));
        } catch (e) {
          log("Could not list databases: " + e.message);
        }
      }

      // Step 3: Write to JupyterLite storage using localforage
      // JupyterLite names its DB "JupyterLite Storage - <baseUrl>", so derive
      // the base path from this page's URL (bridge.html sits at the JupyterLite root).
      const basePath = window.location.pathname.replace(/bridge\.html$/, '');
      const DB_NAME = `JupyterLite Storage - ${basePath}`;
      log("Using DB: " + DB_NAME);

      const filesStore = localforage.createInstance({
        name: DB_NAME,
        storeName: "files",
      });

      const now = new Date().toISOString();
      const contentsModel = {
        name: filename,
        path: filename,
        format: "json",
        created: now,
        last_modified: now,
        content: notebook,
        mimetype: null,
        size: JSON.stringify(notebook).length,
        writable: true,
        type: "notebook",
      };

      try {
        await filesStore.setItem(filename, contentsModel);
        log("SUCCESS: Wrote notebook to localforage");

        // Verify it was written
        const verify = await filesStore.getItem(filename);
        if (verify && verify.name === filename) {
          log("VERIFIED: Can read back notebook from storage");
        } else {
          log("WARNING: Read-back verification failed");
          console.log("[bridge] verify result:", verify);
        }
      } catch (err) {
        log("ERROR writing to localforage: " + err.message);
        console.error("[bridge] Full error:", err);
      }

      // Step 4: List databases again to see what changed
      if (indexedDB.databases) {
        try {
          const dbs = await indexedDB.databases();
          log("Databases after write: " + JSON.stringify(dbs.map(d => d.name + " v" + d.version)));
        } catch (e) { /* ignore */ }
      }

      // Step 5: Also list all keys in the files store
      try {
        const keys = await filesStore.keys();
        log("Keys in files store: " + JSON.stringify(keys));
      } catch (e) {
        log("Could not list keys: " + e.message);
      }

      localStorage.removeItem("fairscape:notebook");
      log("Cleared localStorage. Redirecting to lab in 2s...");
      log("URL: " + LAB_URL + "?path=" + encodeURIComponent(filename));

      // Delay redirect so you can read the logs / open DevTools
      setTimeout(() => {
        window.location.replace(LAB_URL + "?path=" + encodeURIComponent(filename));
      }, 2000);
    })();
  </script>
</body>
</html>
